<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="" width="36" height="36">
  <div>
    <h1>视频画中画</h1>
    <p class="sub">宽度高度随意拖拽 · 自动记忆尺寸</p>
  </div>
</header>

<section id="status" class="card">检测当前页面…</section>

<button id="open" class="primary">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="2" y="4" width="20" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/><rect x="12" y="11" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M8 8.5v5l4.2-2.5z" fill="currentColor"/></svg>
  开启画中画
</button>

<section class="card sizes">
  <h2>默认窗口尺寸</h2>
  <div class="inputs">
    <label>宽 <input id="w" type="number" min="260" max="3840" step="10"></label>
    <span>×</span>
    <label>高 <input id="h" type="number" min="160" max="2160" step="10"></label>
  </div>
  <div class="row">
    <button id="save" class="ghost">保存</button>
    <button id="reset" class="ghost">恢复默认</button>
    <span id="saved" class="saved"></span>
  </div>
  <p class="hint">拖拽小窗边缘或四角可自由调整大小，调整结果自动记住，下次开启直接使用。</p>
</section>

<footer>快捷键 <kbd>Alt</kbd>+<kbd>P</kbd> · 视频右键菜单 · 支持 Chrome / Edge 116+</footer>

<script src="popup.js"></script>
</body>
</html>
